name: E2E

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only run specific tests"
        required: false
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false

      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tok = await core.getIDToken('http://ezoidc:3501')
            core.exportVariable('EZOIDC_GITHUB_TOKEN', tok)

      - run: make test.e2e "only=$ONLY"
        env:
          ONLY: ${{ github.event.inputs.only }}
